<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITIC CRE</title>

    <!-- PWA Mobile Méta-balises -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ITIC CRE" />
    
    <!-- Icône Apple Safari iOS -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Lien Manifeste PWA Mobile -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <script type="module">
      import { ThemeStorageKey } from './src/types/storage-keys';
      (function() {
        const STORAGE_KEY = ThemeStorageKey;
        const storedTheme = localStorage.getItem(STORAGE_KEY);
        if (storedTheme === 'dark' || (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
