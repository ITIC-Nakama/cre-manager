<!DOCTYPE html>
<!--
  Modele "Moderne" : une seule colonne, filet de couleur a gauche, titres de section soulignes. Police Roboto.
  Une seule colonne pour les logiciels de tri (ATS) : le texte extrait suit l'ordre de lecture (nom, coordonnees,
  profil, puis les sections dans l'ordre choisi). Le filet est un simple bord CSS, sans texte.
-->
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
<head>
  <meta charset="UTF-8"/>
  <title th:text="|CV — ${fullName}|">CV</title>
  <meta name="author" th:content="${fullName}"/>
  <meta name="subject" th:content="${cv.identite.titre}"/>
  <style th:replace="~{cv/fragments :: pageCss}"></style>
  <style th:inline="css">
    body { font-family: 'Roboto', 'PT Serif', sans-serif; font-size: 9.3pt; }
    .sheet { border-left: 1.6mm solid [(${accent})]; padding-left: 6mm; }
    .header { margin-bottom: 1.5mm; }
    .header.with-photo { min-height: 28mm; }
    .photo { float: right; width: 24mm; height: 28mm; margin-left: 5mm; border: 0.3mm solid #d1d5db; }
    .name { font-size: 22pt; font-weight: 700; letter-spacing: 0.4pt; text-transform: uppercase; color: #111827; line-height: 1.1; }
    .title { display: inline-block; margin-top: 2mm; padding: 0.8mm 2.2mm; background: [(${accent})]; color: #ffffff;
             font-size: 10pt; font-weight: 500; }
    .contact { margin-top: 2.2mm; color: #374151; font-size: 8.9pt; }
    .contact .sep { color: #9ca3af; }
    .link { margin-right: 3mm; white-space: nowrap; }
    .link-type { color: #6b7280; }
    .section-title { font-size: 10.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8pt;
                     color: [(${accent})]; margin: 0 0 2mm 0; padding-bottom: 1mm; border-bottom: 0.4mm solid [(${accentLight})]; }
    .summary { margin: 0; }
    .skill-group { margin-bottom: 1.2mm; }
    .skill-label { font-weight: 500; display: inline; }
    .skill-items { display: inline; }
    .tag + .tag:before { content: ", "; }
    .lang-row { margin-bottom: 0.8mm; }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="header" th:classappend="${photo != null} ? 'with-photo'">
      <img class="photo" th:if="${photo != null}" th:src="${photo}" alt=""/>
      <div class="name" th:text="${fullName}">Prénom Nom</div>
      <div class="title" th:if="${fmt.present(cv.identite.titre)}" th:text="${cv.identite.titre}">Titre</div>
      <div class="contact">
        <span th:text="${fmt.join('  ·  ', cv.identite.email, cv.identite.telephone, cv.identite.ville)}">email · téléphone · ville</span>
        <th:block th:if="${fmt.present(cv.identite.mobilite)}">
          <span class="sep">  ·  </span><span th:text="|#{cv.mobility}#{cv.colon}${cv.identite.mobilite}|">Mobilité</span>
        </th:block>
      </div>
      <div class="contact" th:if="${!cv.identite.liens.isEmpty()}">
        <th:block th:replace="~{cv/fragments :: links}"></th:block>
      </div>
      <div class="clear"></div>
    </div>

    <div class="section" th:if="${fmt.present(cv.accroche)}">
      <h2 class="section-title" th:text="#{cv.summary}">Profil</h2>
      <p class="summary" th:text="${cv.accroche}">Accroche</p>
    </div>

    <th:block th:each="s : ${sections}">
      <th:block th:replace="~{cv/fragments :: section(${s})}"></th:block>
    </th:block>
  </div>
</body>
</html>
