<!DOCTYPE html>
<!--
  Modele "Moderne" (maquette Jules) : une seule colonne, filet vertical a gauche (bleu clair puis marine),
  logo ITIC au-dessus du nom en capitales, poste vise dans un bandeau marine, titres soulignes, filet discret a
  gauche des entrees. Une seule colonne pour les ATS. Ordre par defaut : experiences d'abord (CvTemplate.MODERNE).
-->
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
<head>
  <meta charset="UTF-8"/>
  <title th:text="|CV — ${fullName}|">CV</title>
  <meta name="author" th:content="${fullName}"/>
  <meta name="subject" th:content="${cv.identite.titre}"/>
  <style th:replace="~{cv/fragments :: pageCss}"></style>
  <style th:inline="css">
    .sheet { position: relative; border-left: 1.8mm solid [(${navy})]; padding-left: 7mm; }
    .filet-top { position: absolute; left: -1.8mm; top: 0; width: 1.8mm; height: 34mm; background: [(${blueLight})]; }
    .header { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .header td { padding: 0; vertical-align: top; }
    .header td.aside { width: 30mm; text-align: right; }
    .logo { width: 33mm; height: auto; margin-bottom: 4mm; }
    .photo { width: 26mm; height: 31mm; border: 0.3mm solid #d5dbe5; }
    .name { font-size: 23pt; font-weight: 700; letter-spacing: 0.6pt; text-transform: uppercase; color: [(${navy})]; line-height: 1.08; }
    .title { display: inline-block; margin-top: 2mm; padding: 0.9mm 2.4mm; background: [(${navy})]; color: #ffffff;
             font-size: 9.4pt; font-weight: 500; }
    .contact { margin-top: 2.2mm; color: #4b5563; font-size: 8.6pt; }
    .contact .sep { color: #9ca3af; }
    .link { margin-right: 3mm; white-space: nowrap; }
    .link-type { color: #6b7280; }
    .summary { margin: 0; color: #374151; }
    .section { margin-top: 3.4mm; }
    .section-title { font-size: 9.8pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6pt;
                     color: [(${navy})]; margin: 0 0 1.8mm 0; padding-bottom: 0.9mm; border-bottom: 0.45mm solid [(${blueLight})]; }
    .section-experiences .entry, .section-formations .entry { border-left: 0.5mm solid [(${blueLight})]; padding-left: 3mm; }
    .entry-title { color: #111827; }
    .entry-sub { font-style: italic; }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="filet-top"></div>
    <table class="header"><tr>
      <td>
        <img class="logo" th:src="${logoNavy}" alt=""/>
        <div class="name" th:text="${fullName}">Prénom Nom</div>
        <div class="title" th:if="${fmt.present(cv.identite.titre)}" th:text="${cv.identite.titre}">Poste visé</div>
        <div class="contact">
          <span th:text="${fmt.join('  ·  ', cv.identite.telephone, cv.identite.email, cv.identite.ville)}">téléphone · email · ville</span>
          <th:block th:if="${fmt.present(cv.identite.mobilite)}">
            <span class="sep">  ·  </span><span th:text="|#{cv.mobility}#{cv.colon}${cv.identite.mobilite}|">Mobilité</span>
          </th:block>
        </div>
        <div class="contact" th:if="${!cv.identite.liens.isEmpty()}">
          <th:block th:replace="~{cv/fragments :: links}"></th:block>
        </div>
      </td>
      <td class="aside" th:if="${photo != null}"><img class="photo" th:src="${photo}" alt=""/></td>
    </tr></table>

    <div class="section" th:if="${fmt.present(cv.accroche)}">
      <h2 class="section-title" th:text="#{cv.summary}">Profil</h2>
      <p class="summary" th:text="${cv.accroche}">Accroche</p>
    </div>

    <th:block th:each="s : ${sections}">
      <th:block th:replace="~{cv/fragments :: section(${s})}"></th:block>
    </th:block>
  </div>
</body>
</html>
