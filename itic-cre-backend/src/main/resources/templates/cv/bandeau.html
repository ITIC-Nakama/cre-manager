<!DOCTYPE html>
<!--
  Modele "Bandeau" (maquette Jules) : en-tete marine sur toute la largeur en haut de la premiere page (logo ITIC
  blanc, nom, poste vise en bleu clair, coordonnees), filet bleu clair dessous ; titres de section precedes d'un
  petit carre bleu (dessine en CSS : aucun caractere dans le texte). Ordre par defaut : formation d'abord.
  Pas de marge laterale de page (le bandeau va d'un bord a l'autre) : le corps du CV porte lui-meme ses 15 mm.
  Le texte du bandeau reste a plus de 15 mm du haut de la page (CvAtsExtractionTest).
-->
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
<head>
  <meta charset="UTF-8"/>
  <title th:text="|CV — ${fullName}|">CV</title>
  <meta name="author" th:content="${fullName}"/>
  <meta name="subject" th:content="${cv.identite.titre}"/>
  <style th:replace="~{cv/fragments :: pageCss}"></style>
  <style th:inline="css">
    @page { margin: 15mm 0; }
    @page :first { margin-top: 0; }
    .band { padding: 10mm 15mm 5.5mm 15mm; background: [(${navy})]; color: #ffffff;
            border-bottom: 1.2mm solid [(${blueLight})]; }
    .content { margin: 0 15mm; }
    .band-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .band-table td { padding: 0; vertical-align: top; }
    .band-table td.aside { width: 30mm; text-align: right; }
    .logo { width: 31mm; height: auto; margin-bottom: 4mm; }
    .photo { width: 26mm; height: 31mm; border: 0.6mm solid #ffffff; }
    .name { font-size: 22pt; font-weight: 700; line-height: 1.1; letter-spacing: 0.2pt; }
    .title { font-size: 10.6pt; font-weight: 500; color: #a9c4ff; margin-top: 1.2mm; }
    .contact { margin-top: 2mm; color: #e3ebff; font-size: 8.6pt; }
    .contact .sep { color: #8ea8d8; }
    .link { margin-right: 3mm; white-space: nowrap; }
    .link-type { color: #b9caee; }
    .summary { margin: 0; color: #374151; }
    .content .section:first-child { margin-top: 4.6mm; }
    .section-title { font-size: 9.8pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6pt;
                     color: [(${navy})]; margin: 0 0 1.8mm 0; }
    .section-title:before { content: ""; display: inline-block; width: 1.7mm; height: 1.7mm; background: [(${blue})];
                            margin-right: 2mm; vertical-align: 0.35mm; }
    .entry-title { color: #111827; }
    .entry-sub { font-style: italic; }
    /* Apercu a l'ecran : la feuille n'a pas de marge laterale, comme le PDF. */
    @media screen { body { width: 210mm; padding: 0 0 15mm 0; } }
  </style>
</head>
<body>
  <div class="band">
    <table class="band-table"><tr>
      <td>
        <img class="logo" th:src="${logoWhite}" alt=""/>
        <div class="name" th:text="${fullName}">Prénom Nom</div>
        <div class="title" th:if="${fmt.present(cv.identite.titre)}" th:text="${cv.identite.titre}">Poste visé</div>
        <div class="contact">
          <span th:text="${fmt.join('  ·  ', cv.identite.telephone, cv.identite.email, cv.identite.ville)}">téléphone · email · ville</span>
          <th:block th:if="${fmt.present(cv.identite.mobilite)}">
            <span class="sep">  ·  </span><span th:text="|#{cv.mobility}#{cv.colon}${cv.identite.mobilite}|">Mobilité</span>
          </th:block>
        </div>
        <div class="contact" th:if="${!cv.identite.liens.isEmpty()}">
          <th:block th:replace="~{cv/fragments :: links}"></th:block>
        </div>
      </td>
      <td class="aside" th:if="${photo != null}"><img class="photo" th:src="${photo}" alt=""/></td>
    </tr></table>
  </div>

  <div class="content">
    <div class="section" th:if="${fmt.present(cv.accroche)}">
      <h2 class="section-title" th:text="#{cv.summary}">Profil</h2>
      <p class="summary" th:text="${cv.accroche}">Accroche</p>
    </div>

    <th:block th:each="s : ${sections}">
      <th:block th:replace="~{cv/fragments :: section(${s})}"></th:block>
    </th:block>
  </div>
</body>
</html>
