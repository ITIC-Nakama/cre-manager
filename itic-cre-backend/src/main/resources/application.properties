# Application - ITIC CRE
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
spring.application.name=itic-cre-api
server.servlet.context-path=/api/v1

# JWT
security.jwt.token.secret-key=${SECRET_KEY:dev-secret-key-change-in-production}
security.jwt.token.refresh-secret-key=${REFRESH_SECRET_KEY:dev-refresh-secret-key-change-in-production}
security.jwt.token.expiration=${TOKEN_EXPIRATION_TIME:3600000}
security.jwt.token.refresh-expiration=${REFRESH_TOKEN_EXPIRATION_TIME:604800000}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:itic_cre}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# OTP
app.otp.expiration-minutes=10
app.otp.length=6
app.mail.from=${SMTP_FROM:no-reply@itic-cre.fr}
app.brand.name=ITIC CRE

# RGPD / GDPR
app.gdpr.otp-retention-hours=${GDPR_OTP_RETENTION_HOURS:24}
app.gdpr.audit-log-retention-days=${GDPR_AUDIT_LOG_RETENTION_DAYS:365}
app.gdpr.inactive-student-retention-days=${GDPR_INACTIVE_STUDENT_RETENTION_DAYS:1095}

# Comptes de test
app.test.seeders.enabled=${TEST_SEEDERS_ENABLED:false}

app.test.admin.email=${TEST_ADMIN_EMAIL:test.admin@itic.fr}
app.test.admin.password=${TEST_ADMIN_PASSWORD:Test123!}
app.test.admin.first-name=${TEST_ADMIN_FIRST_NAME:Admin}
app.test.admin.last-name=${TEST_ADMIN_LAST_NAME:Test}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

app.test.advisor.email=${TEST_ADVISOR_EMAIL:test.advisor@itic.fr}
app.test.advisor.password=${TEST_ADVISOR_PASSWORD:Test123!}
app.test.advisor.first-name=${TEST_ADVISOR_FIRST_NAME:Conseiller}
app.test.advisor.last-name=${TEST_ADVISOR_LAST_NAME:Test}
app.test.advisor.job-title=${TEST_ADVISOR_JOB_TITLE:Conseiller pedagogique}

app.test.student.email=${TEST_STUDENT_EMAIL:test.student@itic.fr}
app.test.student.password=${TEST_STUDENT_PASSWORD:Test123!}
app.test.student.first-name=${TEST_STUDENT_FIRST_NAME:Etudiant}
app.test.student.last-name=${TEST_STUDENT_LAST_NAME:Test}

# Premier administrateur
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
app.bootstrap.admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:ITIC}

# Gouvernance Admin
app.admin.max-active=${ADMIN_MAX_ACTIVE:2}

# Mail (SMTP)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# Storage Configuration
storage.provider=${STORAGE_PROVIDER:local}

# Local Storage Configuration
storage.local.directory=${STORAGE_LOCAL_DIR:./uploads}
storage.local.base-url=${STORAGE_LOCAL_BASE_URL:http://localhost:8080/api/v1/files}

# Cloudflare R2 Configuration
storage.r2.endpoint=${STORAGE_R2_ENDPOINT:}
storage.r2.bucket=${STORAGE_R2_BUCKET:}
storage.r2.access-key=${STORAGE_R2_ACCESS_KEY:}
storage.r2.secret-key=${STORAGE_R2_SECRET_KEY:}
storage.r2.public-url=${STORAGE_R2_PUBLIC_URL:}
storage.r2.region=${STORAGE_R2_REGION:weur}
storage.r2.presigned-url-duration-hours=${STORAGE_R2_PRESIGNED_URL_DURATION_HOURS:24}
storage.r2.public-folder=${STORAGE_R2_PUBLIC_FOLDER:public}

# Multipart Config
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.file-size-threshold=0

# Tomcat connector tuning
server.tomcat.max-swallow-size=${MAX_FILE_SIZE:20MB}
server.tomcat.max-http-form-post-size=${MAX_FILE_SIZE:20MB}
server.tomcat.connection-timeout=${UPLOAD_CONNECTION_TIMEOUT:60s}

# Per-feature size limits
app.upload.max-cv-size-mb=${MAX_CV_SIZE_MB:10}
app.upload.max-image-size-mb=${MAX_IMAGE_SIZE_MB:15}
