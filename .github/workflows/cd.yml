name: Continuous Deployment (C-D)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Compilation du Backend Spring Boot
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests with Maven
        run: |
          cd itic-cre-backend
          mvn -B test

      - name: Build & Package Backend with Maven
        run: |
          cd itic-cre-backend
          mvn -B package

      # Compilation du Frontend React
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'itic-cre-frontend/package-lock.json'

      - name: Build Frontend with Vite/React
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV_CONTENT }}
        run: |
          cd itic-cre-frontend
          
          # Injection des variables spécifiques au Frontend au moment du Build
          echo "$FRONTEND_ENV" > .env
          
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      # Sauvegarde des artefacts pour le job de déploiement
      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: itic-cre-backend/target/*.jar

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: itic-cre-frontend/dist/

      - name: Notify Discord on Build Failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\":[{\"title\":\"Echec de la compilation ITIC CRE\",\"description\":\"La compilation du backend ou du frontend a echoue.\",\"color\":15158332,\"fields\":[{\"name\":\"Commit\",\"value\":\"${COMMIT_SHA}\",\"inline\":true},{\"name\":\"Branche\",\"value\":\"${BRANCH}\",\"inline\":true}]}]}" \
            "${DISCORD_WEBHOOK}"

  deploy:
    needs: build-and-compile
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Téléchargé dans un dossier séparé du répertoire de travail de systemd,
      # pour que la sauvegarde et la copie ci-dessous portent sur deux fichiers distincts.
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: itic-cre-backend-incoming

      # Récupération des fichiers React (dist)
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: itic-cre-frontend/dist

      # Déploiement sur l'environnement natif du serveur, avec sauvegarde de l'existant,
      # bascule quasi sans coupure, health-check et rollback automatique en cas d'échec.
      - name: Deploy application in Native Mode
        working-directory: ${{ github.workspace }}
        env:
          ENV_DATA: ${{ secrets.BACKEND_ENV_CONTENT }}
        run: |
          set -e
          # Chemin absolu plutot que "$HOME/..." : $HOME n'est pas garanti stable/defini
          # de la meme facon selon comment le runner self-hosted invoque ce shell.
          BACKUP_ROOT="/home/github-runner/itic-cre-backups"
          TS=$(date +%Y%m%d-%H%M%S)
          mkdir -p "$BACKUP_ROOT"

          # --- 1. Sauvegarde de l'existant AVANT toute modification ---
          # Le chemin du jar actuellement utilisé par systemd est découvert dynamiquement
          # (pas supposé) pour rester correct même si l'unit file change un jour.
          CURRENT_JAR=$(systemctl show itic-backend.service -p ExecStart --value 2>/dev/null | grep -oE '/[^ ]+\.jar' | head -1 || true)
          BACKUP_JAR="$BACKUP_ROOT/app-${TS}.jar.bak"
          if [ -n "$CURRENT_JAR" ] && [ -f "$CURRENT_JAR" ]; then
            cp "$CURRENT_JAR" "$BACKUP_JAR"
            echo "Sauvegarde du jar actuel : $CURRENT_JAR -> $BACKUP_JAR"
          else
            echo "::warning::Aucun jar actuellement en service detecte (premier deploiement ?) — pas de sauvegarde possible, un rollback ne restaurera rien."
          fi
          if [ -d /var/www/html ] && [ "$(ls -A /var/www/html 2>/dev/null)" ]; then
            sudo rm -rf "$BACKUP_ROOT/frontend-previous"
            sudo cp -r /var/www/html "$BACKUP_ROOT/frontend-previous"
          fi

          # --- 2. Déploiement ---
          echo "$ENV_DATA" > itic-cre-backend/.env
          chmod 600 itic-cre-backend/.env
          sudo chown -R github-runner:github-runner itic-cre-backend

          # rsync : ne touche que les fichiers modifies et supprime les fichiers obsoletes,
          # fenetre de coupure de service quasi nulle.
          sudo rsync -a --delete itic-cre-frontend/dist/ /var/www/html/
          sudo chown -R www-data:www-data /var/www/html/

          NEW_JAR=$(ls itic-cre-backend-incoming/*.jar | head -1)
          DEST_JAR="${CURRENT_JAR:-itic-cre-backend/$(basename "$NEW_JAR")}"
          sudo cp "$NEW_JAR" "$DEST_JAR"

          sudo systemctl restart itic-backend.service
          sudo systemctl restart nginx

          # --- 3. Health-check post-déploiement ---
          SUCCESS=false
          for i in $(seq 1 15); do
            if curl -sfL -o /dev/null "http://localhost:8080/api/v1/health"; then
              SUCCESS=true
              break
            fi
            sleep 4
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "::error::Health-check echoue apres deploiement — tentative de rollback vers la version precedente"
            if [ -n "$CURRENT_JAR" ] && [ -f "$BACKUP_JAR" ]; then
              sudo cp "$BACKUP_JAR" "$CURRENT_JAR"
              sudo systemctl restart itic-backend.service

              ROLLBACK_OK=false
              for i in $(seq 1 10); do
                if curl -sfL -o /dev/null "http://localhost:8080/api/v1/health"; then
                  ROLLBACK_OK=true
                  break
                fi
                sleep 4
              done
              if [ "$ROLLBACK_OK" = "true" ]; then
                echo "::error::Rollback effectue avec succes — le service tourne a nouveau sur la version precedente ($BACKUP_JAR)."
              else
                echo "::error::Rollback tente mais le service ne repond toujours pas apres restauration — intervention manuelle necessaire."
              fi
            else
              echo "::error::Aucune sauvegarde disponible ($BACKUP_JAR introuvable) — rien n'a ete restaure, le service reste sur la version qui vient d'echouer. Intervention manuelle necessaire."
            fi
            if [ -d "$BACKUP_ROOT/frontend-previous" ]; then
              sudo rsync -a --delete "$BACKUP_ROOT/frontend-previous/" /var/www/html/
              sudo systemctl restart nginx
            fi
            exit 1
          fi

          # --- 4. .env est conservé sur disque (chmod 600, proprietaire github-runner) ---
          # Le service a "Restart=always" et systemd relit EnvironmentFile= a CHAQUE
          # redemarrage, pas seulement au premier lancement. Le supprimer ici cassait
          # le redemarrage automatique en cas de crash ulterieur (ex: OOM) : systemd
          # echouait alors a relire un fichier .env qui n'existait plus, en boucle
          # infinie, sans que rien ne puisse s'auto-reparer.

      # Notifications Discord
      - name: Notify Discord on Success
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\":[{\"title\":\"Deploiement ITIC CRE Reussi \",\"description\":\"L'application a ete deployee avec succes en mode natif.\",\"color\":3066993,\"fields\":[{\"name\":\"Commit\",\"value\":\"${COMMIT_SHA}\",\"inline\":true},{\"name\":\"Branche\",\"value\":\"${BRANCH}\",\"inline\":true}]}]}" \
            "${DISCORD_WEBHOOK}"

      - name: Notify Discord on Failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\":[{\"title\":\"Echec du Deploiement ITIC CRE\",\"description\":\"Le health-check a echoue apres deploiement — un rollback automatique vers la version precedente a ete tente. Verifier l'etat du serveur.\",\"color\":15158332,\"fields\":[{\"name\":\"Commit\",\"value\":\"${COMMIT_SHA}\",\"inline\":true},{\"name\":\"Branche\",\"value\":\"${BRANCH}\",\"inline\":true}]}]}" \
            "${DISCORD_WEBHOOK}"