name: Continuous Deployment (C-D)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Script de déploiement testé à chaque passage, sans serveur (faux systemctl/curl) : succès, démarrage lent,
      # boucle de redémarrage, service muet, retour arrière, absence de secours. Un échec bloque le déploiement.
      - name: Test deploy script (rollback scenarios)
        run: bash scripts/deploy/test_deploy_native.sh

      # Compilation du Backend Spring Boot
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests with Maven
        run: |
          cd itic-cre-backend
          mvn -B test

      - name: Build & Package Backend with Maven
        run: |
          cd itic-cre-backend
          mvn -B package

      # Compilation du Frontend React
      # Node 24 (LTS) : Vitest 5 et jsdom 31 (tests du front) ne tournent pas sous Node 20 ; Vite 8 le prend en charge.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'itic-cre-frontend/package-lock.json'

      - name: Build Frontend with Vite/React
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV_CONTENT }}
        run: |
          cd itic-cre-frontend
          
          # Injection des variables spécifiques au Frontend au moment du Build
          echo "$FRONTEND_ENV" > .env
          
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      # Tests du front (Vitest) : un echec arrete le pipeline avant le deploiement (ex. boucle de « Mon CV », #76).
      - name: Run Frontend Tests (Vitest)
        run: |
          cd itic-cre-frontend
          npm test

      # Sauvegarde des artefacts pour le job de déploiement
      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: itic-cre-backend/target/*.jar

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: itic-cre-frontend/dist/

      - name: Notify Discord on Build Failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\":[{\"title\":\"Echec de la compilation ITIC CRE\",\"description\":\"La compilation du backend ou du frontend a echoue.\",\"color\":15158332,\"fields\":[{\"name\":\"Commit\",\"value\":\"${COMMIT_SHA}\",\"inline\":true},{\"name\":\"Branche\",\"value\":\"${BRANCH}\",\"inline\":true}]}]}" \
            "${DISCORD_WEBHOOK}"

  deploy:
    needs: build-and-compile
    runs-on: self-hosted
    environment: production
    # actions: read : télécharger l'artefact du dernier déploiement réussi (version de secours au tout premier passage).
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Téléchargé dans un dossier séparé du répertoire de travail de systemd,
      # pour que la sauvegarde et la copie ci-dessous portent sur deux fichiers distincts.
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: itic-cre-backend-incoming

      # Récupération des fichiers React (dist)
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: itic-cre-frontend/dist

      # Version de secours : le script garde le dernier jar validé (last-good.jar). Au tout premier passage de ce
      # pipeline, il n'existe pas encore : on reprend alors le jar du dernier déploiement réussi (artefact GitHub).
      - name: Check last validated jar
        id: lastgood
        run: |
          if [ -s /home/github-runner/itic-cre-backups/last-good.jar ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Find previous successful deployment
        id: previous
        if: steps.lastgood.outputs.present != 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'cd.yml',
              branch: 'main', status: 'success', per_page: 10,
            });
            const prev = runs.data.workflow_runs.find((r) => r.id !== context.runId);
            core.setOutput('run_id', prev ? String(prev.id) : '');
            core.info(prev ? `Dernier déploiement réussi : run ${prev.id} (${prev.head_sha.slice(0, 7)})` : 'Aucun déploiement réussi trouvé');

      - name: Download previous backend artifact
        if: steps.lastgood.outputs.present != 'true' && steps.previous.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: itic-cre-backend-previous
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}

      # Déploiement natif : sauvegarde, bascule, contrôle de santé (120 s, arrêt plus tôt si boucle de redémarrage)
      # et retour automatique à la version précédente en cas d'échec. Détail et scénarios : scripts/deploy/.
      - name: Deploy application in Native Mode
        working-directory: ${{ github.workspace }}
        env:
          ENV_DATA: ${{ secrets.BACKEND_ENV_CONTENT }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          BOOTSTRAP_JAR=$(ls itic-cre-backend-previous/*.jar 2>/dev/null | head -1 || true)
          BOOTSTRAP_JAR="$BOOTSTRAP_JAR" bash scripts/deploy/deploy_native.sh

      # Notifications Discord
      - name: Notify Discord on Success
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\":[{\"title\":\"Deploiement ITIC CRE Reussi \",\"description\":\"L'application a ete deployee avec succes en mode natif.\",\"color\":3066993,\"fields\":[{\"name\":\"Commit\",\"value\":\"${COMMIT_SHA}\",\"inline\":true},{\"name\":\"Branche\",\"value\":\"${BRANCH}\",\"inline\":true}]}]}" \
            "${DISCORD_WEBHOOK}"

      - name: Notify Discord on Failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\":[{\"title\":\"Echec du Deploiement ITIC CRE\",\"description\":\"Le health-check a echoue apres deploiement — un rollback automatique vers la version precedente a ete tente. Verifier l'etat du serveur.\",\"color\":15158332,\"fields\":[{\"name\":\"Commit\",\"value\":\"${COMMIT_SHA}\",\"inline\":true},{\"name\":\"Branche\",\"value\":\"${BRANCH}\",\"inline\":true}]}]}" \
            "${DISCORD_WEBHOOK}"